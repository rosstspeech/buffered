<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speechmatics Microbatch Transcription</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── Design tokens ── */
    :root {
      --teal-50:  #eafbf6;
      --teal-100: #c8f3e6;
      --teal-400: #14b88a;
      --teal-500: #0a9b73;
      --teal-600: #067d5e;

      --bg:            #fafaf7;
      --bg-elev:       #ffffff;
      --bg-sunk:       #f3f3ee;
      --bg-hover:      #f0f0eb;
      --bg-active:     #e8e8e2;
      --border:        #e6e6df;
      --border-strong: #d4d4cc;

      --text:   #0e0f0d;
      --text-2: #4a4d47;
      --text-3: #7a7d75;
      --text-4: #a4a79f;

      --accent:       var(--teal-500);
      --accent-hover: var(--teal-600);
      --accent-soft:  var(--teal-50);
      --accent-fg:    #ffffff;

      --shadow-sm: 0 1px 2px rgba(10,30,25,0.04), 0 1px 1px rgba(10,30,25,0.03);
      --shadow-md: 0 4px 12px rgba(10,30,25,0.06), 0 2px 4px rgba(10,30,25,0.04);
      --shadow-lg: 0 24px 48px rgba(10,30,25,0.10), 0 4px 12px rgba(10,30,25,0.05);

      --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

      --r-xs: 4px; --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
      --topbar-h: 48px;
      --motion-fast: 120ms; --motion: 220ms;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* ── App shell ── */
    .app-shell {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Main area ── */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg);
    }

    /* ── Topbar ── */
    .topbar {
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elev);
      flex-shrink: 0;
    }
    .tb-title { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .crumb-sep { color: var(--text-4); font-weight: 400; }
    .crumb-end { color: var(--text-3); font-weight: 400; }
    .tb-spacer { flex: 1; }

    /* Status chip */
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 500;
      background: var(--bg-sunk);
      border: 1px solid var(--border);
      color: var(--text-2);
    }
    .status-chip__dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-4);
      flex-shrink: 0;
      transition: background var(--motion) var(--ease);
    }

    .model-badge {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-3);
      padding: 3px 9px;
      background: var(--bg-sunk);
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
    }

    .mode-badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-sunk);
      color: var(--text-3);
    }
    .mode-badge[data-mode="rt"]    { background: var(--accent-soft); border-color: var(--teal-400); color: var(--teal-600); }
    .mode-badge[data-mode="batch"] { background: #fdf1da; border-color: #e7b960; color: #8a5a00; }

    .transport__text {
      display: none;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--bg-elev);
      color: var(--text-2);
      font: 500 12px var(--font-sans);
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--motion-fast) var(--ease);
    }
    .transport__text:hover { background: var(--bg-hover); color: var(--text); }
    .transport__text--visible { display: inline-block; }

    /* ── Two-pane content area ── */
    .content-area {
      flex: 1;
      display: flex;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Transcript pane (left) ── */
    .transcript-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    .pane-header {
      flex-shrink: 0;
      padding: 8px 20px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-4);
      border-bottom: 1px solid var(--border);
      background: var(--bg-elev);
    }

    .tx-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 32px 48px 20px;
      scroll-behavior: smooth;
    }

    #transcript {
      margin: 0 auto;
      max-width: 760px;
      font-size: 17px;
      line-height: 1.65;
      color: var(--text);
      letter-spacing: -0.005em;
    }

    .batch-line {
      margin: 0 0 16px;
      font-size: 17px;
      line-height: 1.65;
    }

    .speaker-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      display: block;
      margin-bottom: 2px;
    }

    .batch-text { color: var(--text); }

    /* ── Processing pane (right) ── */
    .processing-pane {
      width: 300px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
      background: var(--bg-sunk);
    }

    .proc-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      scroll-behavior: smooth;
    }

    #processing-log {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .proc-system {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-4);
      padding: 4px 0;
    }

    /* Batch card */
    .proc-card {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 10px 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      transition: border-color var(--motion) var(--ease);
    }
    .proc-card--done  { border-color: var(--teal-400); }
    .proc-card--error { border-color: #c5361f44; }

    .proc-card__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    .proc-card__batch {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-2);
    }
    .proc-card__time {
      font-size: 11px;
      font-weight: 600;
      color: var(--teal-500);
      opacity: 0;
      transition: opacity var(--motion) var(--ease);
    }
    .proc-card--done .proc-card__time  { opacity: 1; }
    .proc-card--error .proc-card__time { opacity: 1; color: #c5361f; }

    .proc-card__job {
      font-size: 10px;
      color: var(--text-4);
      margin-bottom: 4px;
    }

    .proc-card__status {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--text-3);
      font-size: 11px;
    }
    .proc-card__dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--text-4);
      flex-shrink: 0;
      transition: background var(--motion) var(--ease);
    }
    .proc-card--done  .proc-card__dot { background: var(--teal-500); }
    .proc-card--error .proc-card__dot { background: #c5361f; }

    /* ── Transport bar ── */
    .tx-transport-wrap {
      flex-shrink: 0;
      padding: 12px 16px 20px;
      display: flex;
      justify-content: center;
      background: linear-gradient(to top, var(--bg) 55%, transparent);
      position: relative;
      z-index: 5;
    }

    .transport {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 8px;
      box-shadow: var(--shadow-lg);
      min-width: 360px;
    }

    .transport__rec {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-fg);
      display: grid; place-items: center;
      border: none;
      cursor: pointer;
      transition: all var(--motion) var(--ease);
      flex-shrink: 0;
    }
    .transport__rec:hover { transform: scale(1.06); background: var(--accent-hover); }
    .transport__rec--live {
      background: #c5361f !important;
      animation: recPulse 1.6s ease-in-out infinite;
    }
    .transport__rec--live:hover { background: #a82e18 !important; }
    @keyframes recPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(197,54,31,0.45); }
      50%       { box-shadow: 0 0 0 8px rgba(197,54,31,0); }
    }

    .transport__label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-2);
      padding: 0 6px;
      white-space: nowrap;
      flex: 1;
    }

    .transport__divider {
      width: 1px; height: 20px;
      background: var(--border);
      margin: 0 2px;
      flex-shrink: 0;
    }

    .transport__btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: grid; place-items: center;
      color: var(--text-2);
      background: none;
      border: none;
      cursor: pointer;
      transition: all var(--motion-fast) var(--ease);
      flex-shrink: 0;
    }
    .transport__btn:hover:not(:disabled) { background: var(--bg-hover); color: var(--text); }
    .transport__btn:disabled { opacity: 0.35; cursor: default; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-4); }
  </style>
</head>
<body>
  <div class="app-shell">
    <main class="main-area">

      <!-- Topbar -->
      <div class="topbar">
        <div class="tb-title">
          <span class="crumb-end">Transcribe</span>
          <span class="crumb-sep">/</span>
          <span>Real-time with batch fallback</span>
        </div>
        <div class="tb-spacer"></div>
        <div class="status-chip">
          <div class="status-chip__dot" id="status-dot"></div>
          <span id="status-text">IDLE</span>
        </div>
        <div class="mode-badge" id="mode-badge" data-mode="idle">Idle</div>
        <div class="model-badge" id="model-badge">—</div>
      </div>

      <!-- Two-pane content area -->
      <div class="content-area">

        <!-- Left: collated transcript -->
        <div class="transcript-pane">
          <div class="pane-header">Transcript</div>
          <div class="tx-scroll" id="transcript-scroll">
            <div id="transcript"></div>
          </div>
        </div>

        <!-- Right: processing log -->
        <div class="processing-pane">
          <div class="pane-header">Processing</div>
          <div class="proc-scroll" id="proc-scroll">
            <div id="processing-log"></div>
          </div>
        </div>

      </div>

      <!-- Transport bar -->
      <div class="tx-transport-wrap">
        <div class="transport">
          <button id="rec-btn" class="transport__rec" title="Start recording">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="12" r="8"/>
            </svg>
          </button>
          <span class="transport__label" id="batch-timer">Ready to transcribe</span>
          <button id="reconnect-btn" class="transport__text" title="Stop batch fallback and try real-time again">Reconnect real-time</button>
          <button id="drop-btn" class="transport__text" title="Test: drop the real-time connection once">Simulate drop</button>
          <button id="outage-btn" class="transport__text" title="Test: drop the connection and fail every reconnect until fallback">Simulate outage</button>
          <div class="transport__divider"></div>
          <button id="download" class="transport__btn" title="Download WAV" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </button>
        </div>
      </div>

    </main>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
